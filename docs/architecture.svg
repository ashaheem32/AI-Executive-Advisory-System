<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-label="Northstar architecture showing authentication before authorization-filtered retrieval and a database summary workflow">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#819475" stroke-width="1.5"/></marker><style>text{font-family:'Avenir Next','Segoe UI',sans-serif;fill:#2d4334}.box{fill:#fff;stroke:#d6e0cc;stroke-width:1.5}.title{font-size:19px;font-weight:600}.body{font-size:14px;fill:#7c8d6c}.label{font-size:11px;letter-spacing:1.7px;fill:#ab704c}.line{fill:none;stroke:#819475;stroke-width:1.5;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="840" fill="#f4f6ee"/><rect width="1280" height="132" fill="#1d342c"/>
<text x="48" y="43" class="label" style="fill:#d99b6f">NORTHSTAR / SYSTEM ARCHITECTURE</text><text x="48" y="88" style="font-family:Georgia,serif;font-size:34px;fill:#f1f3e6">Evidence starts with the right access.</text><text x="1230" y="89" text-anchor="end" style="font-size:13px;fill:#adbea4">Local proof of concept</text>
<rect class="box" x="48" y="168" width="275" height="100" rx="9"/><text class="title" x="70" y="204">Browser dashboard</text><text class="body" x="70" y="232">Questions, uploads, source viewer</text>
<path class="line" d="M323 218H385"/>
<rect x="395" y="168" width="480" height="100" rx="9" fill="#e7eddf" stroke="#c7d4ba"/><text class="title" x="419" y="204">FastAPI authentication + permissions</text><text class="body" x="419" y="232">Server-trusted role · session · CSRF · upload bounds</text>
<rect class="box" x="938" y="168" width="294" height="100" rx="9"/><text class="title" x="960" y="204">SQLite</text><text class="body" x="960" y="231">Users · sessions · text · chunks</text><text class="body" x="960" y="251">Summary jobs · audit metadata</text><path class="line" d="M875 218H926"/>
<path class="line" d="M635 268V308"/>
<rect x="395" y="320" width="480" height="91" rx="9" fill="#203c30"/><text x="419" y="355" class="title" style="fill:#f0f4e6">SQL authorization filter BEFORE retrieval</text><text x="419" y="382" class="body" style="fill:#b1c5a5">Confidential text never enters unauthorized candidates</text>
<rect class="box" x="48" y="320" width="275" height="91" rx="9"/><text class="title" x="70" y="355">Administrator uploads</text><text class="body" x="70" y="382">PDF / DOCX / text → extraction</text><path class="line" d="M185 268V308"/>
<rect class="box" x="48" y="460" width="275" height="105" rx="9"/><text class="title" x="70" y="496">Database automation</text><text class="body" x="70" y="523">Pending → claimed → summary</text><text class="body" x="70" y="546">Persist · retry · restart recovery</text><path class="line" d="M185 411V448"/>
<path d="M635 411V431" fill="none" stroke="#819475" stroke-width="1.5"/>
<rect class="box" x="395" y="460" width="222" height="105" rx="9"/><text class="title" x="417" y="496">Finance advisor</text><text class="body" x="417" y="523">Labelled source metrics</text><text class="body" x="417" y="546">Decimal calculations</text>
<rect class="box" x="653" y="460" width="222" height="105" rx="9"/><text class="title" x="675" y="496">Knowledge + HR</text><text class="body" x="675" y="523">Lexical evidence search</text><text class="body" x="675" y="546">Missing/conflicting facts</text><path class="line" d="M635 431H764V448"/><path class="line" d="M635 431H506V448"/>
<rect x="938" y="460" width="294" height="105" rx="9" fill="#f3eadb" stroke="#dfd0b9"/><text class="title" x="960" y="496">Optional OpenAI API</text><text class="body" x="960" y="523">Select exact source quotes</text><text class="body" x="960" y="546">Authorized excerpts only</text><path class="line" d="M875 512H926" stroke-dasharray="5 5"/>
<path class="line" d="M506 565V628"/><path class="line" d="M764 565V628"/><path class="line" d="M1085 565V600H810V628"/>
<rect x="395" y="640" width="480" height="98" rx="9" fill="#e7eddf" stroke="#c7d4ba"/><text class="title" x="419" y="677">Verified evidence + visible calculations</text><text class="body" x="419" y="706">Quote validation · source references · safe fallback</text>
<path class="line" d="M395 689H348V287H185V280"/>
<text class="label" x="48" y="790">DESIGNED FOR A SMALL SYNTHETIC DEMONSTRATION</text><text class="body" x="1232" y="790" text-anchor="end">Single service · no external database credentials · no email sending</text>
</svg>
